- id: 16
  content: 《铁甲争雄坦克兵》主要内容：一群群铁甲巨兽从第一次世界大战中横空出世，他们都是集猛烈的炮火、快速的机动力和厚厚的装甲于一身的大家伙，常常被人们称为“陆战之王”。在整个20世纪的战场上，这些大家伙们发挥了不可替代的关键作用。多少位以指挥装甲兵作战的人物，多少次具有神奇色彩的坦克鏖战，都在血与火的战争历史上留下了浓墨重彩。《铁甲争雄——坦克兵》从坦克兵的渊源、概况以及坦克型号、著名战例等诸方面，通过大量精彩的图片，生动地讲述坦克及坦克兵的故事。相信《铁甲争雄坦克兵》可以向您展示一个既充满硝烟炮火，又不乏智慧谋略的精彩世界。[1]
