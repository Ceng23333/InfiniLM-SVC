- id: 19
  content: 1915年9月15日清晨，索姆河一线战场上被薄雾所笼罩。7时半，德军阵地前爆发出“轰隆、轰隆”巨响。英军坦克部队的49辆坦克，驶到进攻出发地只有32辆。英军的32辆坦克从两翼展开，向德军阵地冲去。这些钢铁怪物，身挂钢甲，形如房屋，车底下没有轮子，恰能自动行进。在冲锋过程中，5辆坦克陷进了沼泽，9辆坦克机械损坏，只余下18辆坦克。它们喷着烟雾，吐着火舌，绕过战场障碍物，碾压过铁丝网，逼近德军阵地。德军士兵看到这些会喷火的钢铁怪物，惊呆了。多数德军士兵拔腿就跑，少数德军士兵集中火力，向英军坦克射击，奇怪的是枪弹在坦克体上滑落下来。坦克的履带压垮了德军防御阵地上的铁丝网，坦克越过战壕。德军士兵抱头逃跑。谁知坦克两侧的机枪也能旋转。“哒、哒、哒”，几秒钟就扫倒100多人，来不及逃跑的德军士兵，被坦克的履带碾压成肉浆。首次坦克战打得十分威武，英军坦克开足马力在德军阵地上行驶。在英军坦克冲击下，德军溃不成军，被打死、炸死、压死的不计其数。两小时的坦克战，德军防线被英军突破了。英军坦克首次战斗获得胜利，证明坦克是突破阵地防守的有效武器。索姆河坦克战使坦克声誉大振，坦克竟成了魔鬼的代名词，德军士兵只要看见坦克，就闻风丧胆，丢
- id: 20
  content: 34机动性的优势来战胜笨重的“虎式”坦克。在冲锋过程中，苏军坦克付出了惨重代价。当双方接近后，战斗变得更加惨烈，坦克一辆一辆地被摧毁，但在被毁的坦克旁，双方的坦克兵仍在互相射击，甚至互相肉搏。战斗一直持续到傍晚，最后因双方都精疲力竭才停了下来，而战场上到处都是坦克残骸和尸体。在这天的坦克大战中德军虽然以相对较小的损失，摧毁了更多的苏军坦克，但他们却没能攻占普罗霍罗夫卡，而随后源源赶到的苏军援兵使他们的防线将更加坚固。北线：在北线，苏军的炮击也使德军的进攻比计划推迟了2个半小时，在几十分钟的炮火准备和空中轰炸之后，德第9集团按计划开始了进攻。莫德尔为了把苏军的注意力从德军的主攻方向上引开，先在左翼以3个步兵师实施佯攻，但被苏军阻止住了。在主攻方向，德军集中了4个装甲师和3个步兵师的兵力，经过激烈的战斗，他们突破了苏第13集团军的第一道防线，艰难地向前推进了5公里。但在两翼，苏军顽强地守住了阵地。在地面激战的同时，双方的空军也在进行激战，这一天德军出动了1000架多次，苏联空军也出动了600余架次。双方战至5日终了时，德军只向前突破不足10公里，却至少损失了70辆坦克。第二天，罗科索夫斯基开始发动反击，莫德尔也把
