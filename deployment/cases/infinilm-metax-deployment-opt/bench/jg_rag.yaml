- id: 6
  content: '# 较量坦克战的战略、战术和战例


    《较量坦克战的战略、战术和战例》是2010年军事谊文出版社出版的图书，作者是（瑞典）乔根森、（英）曼。


    | 书名 | 作者 | 译者 | ISBN | 类别 | 页数 | 出版社 | 出版时间 | 装帧 | 开本 |

    | ---- | ---- | ---- | ---- | ---- | ---- | ---- | ---- | ---- | ---- |

    | 较量坦克战的战略、战术和战例 | （瑞典）乔根森、（英）曼 | 孔鑫 | 9787801507426 | 图书>政治/军事>军事理论 | 250 | 军事谊文出版社 | 2010-01-01 | 平装 | 16开 |


    ## 编辑推荐


    《较量坦克战的战略、战术和战例》展示了西方与苏联军事家们对坦克战略与战术的发展进程的探讨，以及富勒和"闪电战之父"古德里安等人的理论在装甲部队使用方面的基本情况。从康布雷到库尔斯克、中国战场乃至海湾战争，通过对大量坦克战的认真分析，详细介绍了凝聚着无数坦克战理论家与实践家们心血和汗水的战略与战术是如何成功应用于战场的。


    ## 内容简介'
- id: 7
  content: ，瓦图京指挥部队继续在正面抵挡德军向奥博扬推进，同时在两翼连续发动反击，虽然这些反击一次又一次的遭到失败，但却使德军无法全力以赴的攻击他们的主要目标。德第4装甲集团军司令霍斯将军见无法从正面突破奥博扬，便决定先从右翼突破，他命令第2党卫装甲军转向东北的普罗霍罗夫卡。接下来的两天，德军的进攻还比较顺利，他们攻到了普罗霍罗夫卡城下，库尔斯克会战的高潮－上演了。战后很长时间，史学家们一直认为在1943年7月12日苏德双方共有1500余辆坦克和自行火炮在普罗霍罗夫卡激战，普罗霍罗夫卡坦克大战也因此被认为是人类战争史上最大规模的坦克战，并闻名于世，成为一个传奇。随着时间的推移，大量资料的解密，尤其是冷战的结束，前苏联资料的公开，使得研究者们发现这次坦克大战的规模要比原先认为的小得多，双方直接参战的坦克和自行火炮也只有约600辆。其中德军不到200辆，苏联红军约400辆。战斗打响，苏德双方几乎是同时发动了进攻，在战斗中德军“虎式”坦克的88毫米炮与四号坦克的75毫米坦克炮优势明显，而苏联红军T-
- id: 8
  content: '34型和德国“豹”式坦克，一直到今天的美国M1“艾布拉姆斯”、英国“挑战者”、法国“勒克莱尔”以及前苏联的T-72型坦克，每种坦克的设计与能力都促成了其自身独有的战法。 通过大量翔实的战地图片，《较量》这部权威力作将引领你进入20世纪装甲战的历史长河。


    ## 作者简介'
- id: 9
  content: 首次驰骋一战至今，坦克始终都令敌人产生一种莫名的敬畏。本书为我们展现了作为进攻性武器，坦克是如何称雄于整个20世纪的。克赖斯特·乔根森与克里斯·曼通过对历史上重大坦克战役的深刻探讨，为我们揭示了其中的奥秘。在历次重大战役中，坦克在所有指挥官的进攻计划中始终都扮演着最重要的角色。 在本书中，成功的坦克战略、战术将会与那些计划和执行得不太好的坦克战术进行清晰地比较。例如，1940年法国分散使用其单车性能优异的坦克迎击德国“闪电战”的惨烈一幕。书中附有大量翔实的地图与示意图，充分展示了坦克驰骋在欧洲、非洲与亚洲战场上的雄姿，同时还详细分析了众多坦克战役中所使用的坦克战术。 本书展示了西方与苏联军事家们对坦克战略与战术的发展进程的探讨，以及富勒和“闪电战之父”古德里安等人的理论在装甲部队使用方面的基本情况。从康布雷到库尔斯克、中国战场乃至海湾战争，通过对大量坦克战的认真分析，详细介绍了凝聚着无数坦克战理论家与实践家们心血和汗水的战略与战术是如何成功应用于战场的。 从对一个世纪以来坦克设计、改进的全面研究着手，作者详细介绍了坦克这一铁甲枭雄的发展历程：从一战时期的英国雄式和雌式坦克，到二战时期的苏联T-
