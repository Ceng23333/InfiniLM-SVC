  content: '# 库尔斯克坦克大战


    1943年3月，德军重新占领了哈尔科夫。7月，希特勒向苏联库尔斯克地区调集了五十个师的精锐部队企图夺回在苏主动权，但本应该5月出击为了新式武器即虎式坦克与豹式坦克却拖到了7月此时苏军也准备好了他们的T34坦克，一场坦克大战一触即发。【库尔斯克坦克大战】


