  user_prompt: "**rag分支：**\nPlease answer the user's question strictly based on the following reference documents.\n\nNote: Each document passage is prefixed with an identifier such as \"[1]\", \"[2]\", \"[3]\".\nThese identifiers must be used exactly as citation IDs in your answer.\nDo NOT create new IDs, modify IDs, or cite content not present in the documents.\n\n【Answering & Citation Rules】\n1. Every factual statement must end with citation(s) using the corresponding document ID(s).\n   Example: \"Quantum entanglement is a physical phenomenon[1].\"\n2. Citation format must strictly be `[id]` (square brackets only).\n   Incorrect: \"(Doc 1)…\", \"According to [1]…\"\n3. If multiple documents support a single statement, append citations consecutively, e.g. `[1][3][5]`.\n4. Do not repeat or restate entire documents. Summaries must still obey citation rules.\n\nPlease answer the following question based on the given documents.\nThink step by step.\n\nDocuments:\n{{documents}}\n\nQuestion: {{question}}\n"
