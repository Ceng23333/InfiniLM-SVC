  content: 库尔斯克坦克大战[1]电影由尤里·奥泽洛夫导演、米哈依尔·乌里杨诺夫、尼古拉·奥里亚林、弗里茨·吉茨、鲍威尔·布特、伊沃·加拉尼等主演的电影。图书《库尔斯克坦克大战》由王志强编写，外文出版社出版。[6]
- id: 2
  content: '从库尔斯克硝烟到阿拉曼战役对决，从柏林巷战中坦克的尴尬，到中东战争中，美、苏制坦克大比拼，都显示着坦克在战场上无与伦比的地位。在它漫长的发展史中，始终都伴随着硝烟与智慧、血腥与思考，以及一切关于死亡的惊悚记忆。索姆河战役：一群装甲怪物突然冲出阵地，吓呆了德国人。突袭波兰：德国坦克的“闪电战”，横扫欧洲。斯大林格勒保卫战：苏联的“雪地之王”让希特勒吃尽了苦头。库尔斯克：真正的大场面，千余辆坦克的大决战。里纳瓦村血战：两辆坦克VS一个坦克团。


    ## 图书目录'
- id: 3
  content: '尽数现代战场上经典的陆战对决！重温二战浓浓硝烟中的著名战役！感受埃及漫天扬尘里的炮火轰鸣！领略中东滚滚油烟中的钢铁较量！本书充分展现了坦克这种具有强大火力、坚固防御力以及强劲机动力的的钢铁堡垒的巨大魅力，详细介绍了各国坦克部队发挥的巨大作用，以及坦克军和空军步兵等完美配合打出的漂亮战役。另外，作者还在每一节后面以关键词的形式重点介绍了本节内容涉及到的坦克，包括其生产设计的来龙去脉，型号的更迭交替，还有各个型号不同的战斗全重、武器装备、行驶能力、优劣对比等，为爱好军事的读者提供了最详细准确的坦克资料。当代战争已经朝着数字化、信息化的方向发展，历史上千辆以上坦克大会战的景象估计在今后越来越现代化的战争中很难再出现。但是，本书可以带领读者在铁与火的战场上，重新回味经典坦克战独特的魅力。


