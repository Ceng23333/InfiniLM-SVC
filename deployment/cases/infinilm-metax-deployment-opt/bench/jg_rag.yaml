    --说明来源

    回答每个核心观点后，必须紧跟来源标签。例如：[来源1：关于XX的通知第3段]。


    --参考文件引用规则

    所有事实性表述后，均需标注对应参考文件的编号。

    引用格式必须严格为[编号]（仅使用方括号）。

    若单一表述有多个参考文件支撑，需连续标注编号，例：[1][3][5][1]。

    不得重复或复述参考文件全文，内容总结仍需遵守上述引用规则 [1]。


